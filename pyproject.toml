[project]
name = "jobagent"
version = "0.1.0"
description = "AI agent that finds and ranks job openings against a CV and career aspirations"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobagent*"]

[tool.setuptools.package-data]
jobagent = ["web/*"]
