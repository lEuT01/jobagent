# Employers whose career pages are polled directly. Slugs / tenants drift: when one breaks it is
# logged and skipped. To find a slug: open the firm's careers site and look at the URL or the
# network tab. Greenhouse:  boards.greenhouse.io/<slug>    Lever: jobs.lever.co/<slug>
# Workday: https://<host>/<site>  where host looks like <tenant>.wd3.myworkdayjobs.com
#
# The ATS mappings below are best guesses as of Nov 2026. Run `jobagent run -v --no-score`
# once and remove or fix the ones that log failures.

